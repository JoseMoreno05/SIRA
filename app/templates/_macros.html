{% macro icono(n) -%}
{%- if n == 'rojo' -%}
<svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><polygon points="6,1 14,1 19,6 19,14 14,19 6,19 1,14 1,6" fill="currentColor"/><rect x="5" y="9" width="10" height="2.4" rx="1" fill="#fff"/></svg>
{%- elif n == 'amarillo' -%}
<svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><polygon points="10,1.5 19,18 1,18" fill="#E3A008" stroke="#7A4A00" stroke-width="1.4" stroke-linejoin="round"/><rect x="9" y="7" width="2" height="6" rx="1" fill="#2B1B00"/><circle cx="10" cy="15.2" r="1.1" fill="#2B1B00"/></svg>
{%- else -%}
<svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="9" fill="currentColor"/><path d="M5.8 10.3l2.7 2.7 5.7-5.9" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
{%- endif -%}
{%- endmacro %}

{% macro nivel(n, etiqueta) -%}
<span class="nivel nivel--{{ n }}">{{ icono(n) }}<span>{{ etiqueta }}</span></span>
{%- endmacro %}

{% macro check(ok) -%}
{%- if ok -%}
<svg class="ok" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="currentColor"/><path d="M5.8 10.3l2.7 2.7 5.7-5.9" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
{%- else -%}
<svg class="falla" viewBox="0 0 20 20" aria-hidden="true"><polygon points="6,1 14,1 19,6 19,14 14,19 6,19 1,14 1,6" fill="currentColor"/><path d="M6.5 6.5l7 7M13.5 6.5l-7 7" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
{%- endif -%}
{%- endmacro %}
